name: Validate Marketing OS
on:
  push:
    paths:
      - "skills/marketing-os/**"
      - ".github/workflows/validate-marketing-os.yml"
  pull_request:
    paths:
      - "skills/marketing-os/**"
      - ".github/workflows/validate-marketing-os.yml"
jobs:
  validate:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: skills/marketing-os
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Validate SKILL.md spec and context budget
        run: python scripts/check_skill_spec.py .
      - name: Validate copy example
        run: python scripts/check_copy.py examples/ad-variants.json
      - name: Validate creative example
        run: python scripts/check_creative.py examples/creative-manifest.json
      - name: Validate Google Search RSA draft
        run: python scripts/check_search_ads.py examples/google-search-rsa-draft.json
      - name: Validate email and SMS plan draft
        run: python scripts/check_messaging_plan.py examples/messaging-plan-draft.json
      - name: Validate marketing data pipeline manifest
        run: python scripts/check_marketing_data_plan.py examples/marketing-data-pipeline-manifest.json
      - name: Validate media plan example
        run: python scripts/check_media_plan.py examples/media-plan.json
      - name: Validate context file example
        run: python scripts/check_context_file.py examples/brand-truth-example.md --today 2026-11-09
      - name: Validate landing page example
        run: python scripts/check_page_meta.py examples/landing-page-skeleton.html
      - name: Validate internal links
        run: python scripts/check_links.py .
